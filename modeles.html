<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modèles de la chambre</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #241435; color: #fff; font-family: Inter, system-ui, sans-serif; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .barre { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .barre h1 { font-size: 16px; margin: 0 12px 0 0; font-weight: 600; }
      button { color: #fff; background: #302139ed; border: 1px solid #ffffff30; border-radius: 18px; padding: 7px 14px; font: 500 13px Inter, system-ui, sans-serif; cursor: pointer; }
      button:hover { border-color: #ffffff80; }
      button.principal { background: #8c567a; }
      #etat { font-size: 12px; opacity: 0.7; }
    </style>
  </head>
  <body>
    <canvas id="vue"></canvas>
    <div class="barre" id="barre">
      <h1>Modèles de la chambre</h1>
      <button id="tous" type="button">Tous</button>
      <button id="exporter" class="principal" type="button">Exporter les .glb</button>
      <span id="etat"></span>
    </div>
    <script type="module" src="/src/modeles/galerie.js"></script>
  </body>
</html>
