<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#241435" />
    <title>Ma chambre</title>
    <meta name="description" content="Ma chambre en 3D : fais le tour de la pièce, allume les lumières, la télé, et regarde le soleil passer à l'heure réelle de Paris." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ma chambre" />
    <meta property="og:description" content="Ma chambre en 3D : fais le tour de la pièce, allume les lumières, la télé, et regarde le soleil passer à l'heure réelle de Paris." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="fond" aria-hidden="true"></div>
    <canvas id="scene"></canvas>
    <div class="grain" aria-hidden="true"></div>

    <nav class="vues" id="vues" aria-label="Choisir une vue"></nav>
    <div class="commandes commandes-murs" id="cmd-murs" role="group" aria-label="Murs"></div>
    <div class="commandes commandes-gauche" id="croix" role="group" aria-label="Pivoter la vue"></div>
    <div class="commandes commandes-droite" id="cmd-droite" role="group" aria-label="Vue et zoom"></div>

    <div class="lumieres" id="lumieres" role="group" aria-label="Lumières et appareils"></div>

    <header class="ville" id="ville" aria-label="Lieu et heure">
      <div class="ville-tete" id="ville-tete" tabindex="0">
        <span class="ville-nom" id="ville-nom">Paris</span>
        <span class="ville-heure" id="heure">12:00</span>
      </div>
      <div class="ville-panneau">
        <div class="ville-interieur">
          <div class="ville-reglage">
            <input id="curseur" type="range" min="0" max="24" step="0.05" value="12" aria-label="Heure du jour" />
            <button id="live" type="button">Heure réelle</button>
          </div>
          <span id="soleil-heures" class="soleil-heures" title="Lever et coucher du soleil réels du jour"></span>
        </div>
      </div>
    </header>

    <!-- mode secret : le petit bonhomme (src/perso.js) -->
    <button class="perso-quitter" id="perso-quitter" type="button" hidden>Quitter</button>
    <button class="perso-debloquer" id="perso-debloquer" type="button" hidden>Débloquer (R)</button>
    <div class="perso-aide" id="perso-aide" hidden>ZQSD : bouger · Souris : caméra · Maj : sprint · Espace : sauter · Ctrl : glisser · E : agir · Échap : quitter</div>
    <div class="perso-action" id="perso-action" hidden></div>
    <div class="perso-stick" id="perso-stick" hidden><div class="perso-pomme" id="perso-pomme"></div></div>
    <button class="perso-agir" id="perso-agir" type="button" hidden>Agir</button>
    <button class="perso-saut" id="perso-saut" type="button" hidden>Saut</button>

    <!-- menu d'accueil : le choix de la pièce, à chaque arrivée (src/accueil.js) -->
    <div id="accueil" class="accueil" aria-roledescription="carrousel">
      <h1 class="sr-only" id="accueil-nom">Chambre</h1>
      <!-- une miniature par pièce (créées par src/accueil.js) : la vraie scène 3D, dans une iframe -->
      <div class="accueil-scene" id="accueil-scene"></div>
      <div class="accueil-textes">
        <svg class="accueil-arc haut" viewBox="0 0 600 160" aria-hidden="true">
          <defs><path id="arc-haut" d="M 60 140 Q 300 55 540 140" fill="none" /></defs>
          <text><textPath href="#arc-haut" startOffset="50%" text-anchor="middle" id="titre-arc">Chambre</textPath></text>
        </svg>
        <svg class="accueil-arc bas" viewBox="0 0 600 160" aria-hidden="true">
          <defs><path id="arc-bas" d="M 45 12 A 300 300 0 0 0 555 12" fill="none" /></defs>
          <text><textPath href="#arc-bas" startOffset="50%" text-anchor="middle" id="sous-titre-arc">Paris</textPath></text>
        </svg>
        <button type="button" class="accueil-visiter" id="visiter">Visiter</button>
      </div>
      <button type="button" class="accueil-fleche gauche" id="precedent" aria-label="Pièce précédente">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7" /></svg>
      </button>
      <button type="button" class="accueil-fleche droite" id="suivant" aria-label="Pièce suivante">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
      </button>
    </div>

    <div id="chargement" class="chargement" role="status" aria-live="polite">
      <div class="chargement-titre">Chambre</div>
      <div class="chargement-barre"><div class="chargement-niveau" id="chargement-niveau"></div></div>
      <div class="chargement-texte" id="chargement-texte">Chargement…</div>
    </div>

    <script type="module" src="/src/accueil.js"></script>
  </body>
</html>
